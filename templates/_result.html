{% if error %}
<div class="flex items-start gap-3 rounded-xl border border-red-200 bg-red-50 p-4 text-red-700">
  <svg class="mt-0.5 h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
  </svg>
  <p>{{ error }}</p>
</div>
{% elif deleted %}
<div class="flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 p-4 text-slate-600">
  <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
  </svg>
  <p>Your images and PDF were deleted from the server.</p>
</div>
<script>resetUploader();</script>
{% else %}
<div class="rounded-xl border border-emerald-200 bg-emerald-50 p-4">
  <div class="flex items-center gap-3">
    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-emerald-600">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
      </svg>
    </div>
    <div class="min-w-0">
      <p class="font-semibold text-emerald-900">Your PDF is ready</p>
      <p class="truncate text-sm text-emerald-700">
        {{ pdf_name }} · {{ page_count }} page{{ "s" if page_count != 1 }}
      </p>
    </div>
  </div>
  <div class="mt-4 flex flex-col gap-2 sm:flex-row">
    <a
      href="/download/{{ job_id }}/{{ pdf_name }}"
      hx-boost="false"
      class="flex flex-1 items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 font-medium text-white transition hover:bg-indigo-700"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
      </svg>
      Download PDF
    </a>
    <button
      hx-post="/delete/{{ job_id }}"
      hx-target="#api-response"
      hx-confirm="Delete the uploaded images and the PDF from the server?"
      hx-disabled-elt="this"
      class="flex items-center justify-center gap-2 rounded-lg border border-red-200 bg-white px-4 py-2.5 font-medium text-red-600 transition hover:bg-red-50 disabled:opacity-50"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.35 9m-4.78 0-.35-9m9.97-3.21c.34.05.68.11 1.02.17m-1.02-.17-1.07 13.87A2.25 2.25 0 0 1 15.92 21H8.08a2.25 2.25 0 0 1-2.24-2.08L4.77 5.79m14.46 0a48.1 48.1 0 0 0-3.48-.4m-12 .56c.34-.06.68-.11 1.02-.17m0 0a48.1 48.1 0 0 1 3.48-.4m7.5 0v-.92c0-1.18-.91-2.16-2.09-2.2a51.96 51.96 0 0 0-3.32 0c-1.18.04-2.09 1.02-2.09 2.2v.92m7.5 0a48.67 48.67 0 0 0-7.5 0" />
      </svg>
      Delete
    </button>
  </div>
</div>
{% endif %}
